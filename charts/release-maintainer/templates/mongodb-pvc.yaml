{{- if and .Values.mongodb.enabled .Values.mongodb.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-mongodb
  annotations:
    # The data is deleted with the PVC (reclaimPolicy Delete), so never let
    # Argo CD prune it, e.g. if persistence is later switched off.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mongodb.persistence.size }}
  {{- with .Values.mongodb.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
